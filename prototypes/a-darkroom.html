<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUE · Darkroom</title>
<!-- PROTOTYPE — Direction A. Throwaway; the live library is untouched.
     Achromatic chrome so the decks supply every colour. Accent is reserved
     for state (focus, active, danger) and never used for decoration.
     Typefaces are the OS's own, so this page already renders offline. -->
<style>
  :root {
    /* one neutral ramp, no blue cast */
    --canvas:#0B0B0C; --raised:#131315; --raised-2:#17171A;
    --line:#26262A; --line-soft:#FFFFFF0F;
    --ink:#F4F4F5; --ink-2:#A1A1A6; --ink-3:#6E6E76;
    /* state only */
    --focus:#F4F4F5; --danger:#F2646B; --ok:#5BD6A0;
    /* three radii, locked */
    --r-lg:14px; --r-md:8px; --r-pill:999px;
    --ease:cubic-bezier(.32,.72,0,1);
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--canvas); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; min-height:100vh; }

  header { display:flex; align-items:baseline; gap:14px;
    padding:40px 44px 0; max-width:1560px; margin:0 auto; }
  .word { font-size:21px; font-weight:600; letter-spacing:-.025em; }
  .mark { width:26px; height:26px; border-radius:7px; align-self:center; }
  .count { font-family:var(--mono); font-size:12px; color:var(--ink-3); }
  .grow { flex:1; }

  .btn { font-family:var(--sans); font-size:13px; font-weight:500; color:var(--ink);
    background:var(--raised-2); border:1px solid var(--line); border-radius:var(--r-md);
    padding:8px 15px; cursor:pointer; transition:background .4s var(--ease), border-color .4s var(--ease); }
  .btn:hover { background:#202024; border-color:#34343A; }
  .btn:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }

  main { padding:8px 44px 90px; max-width:1560px; margin:0 auto; }

  /* sentence case, no uppercase-mono eyebrow rhythm */
  .sect { display:flex; align-items:baseline; gap:12px; margin:44px 0 18px; }
  .sect:first-child { margin-top:30px; }
  .sect h2 { font-size:15px; font-weight:600; color:var(--ink); letter-spacing:-.01em; }
  .sect .n { font-family:var(--mono); font-size:11px; color:var(--ink-3); }
  .rule { flex:1; height:1px; background:var(--line); opacity:.55; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:22px; }

  /* double bezel: outer tray holds an inner plate at a concentric radius */
  .card { background:var(--raised); border:1px solid var(--line-soft); border-radius:var(--r-lg);
    padding:6px; transition:background .5s var(--ease), border-color .5s var(--ease), transform .5s var(--ease); }
  .card:hover { background:var(--raised-2); border-color:#FFFFFF1F; transform:translateY(-2px); }
  .plate { position:relative; aspect-ratio:16/9; border-radius:calc(var(--r-lg) - 6px);
    overflow:hidden; background:#000; box-shadow:inset 0 1px 0 #FFFFFF14; cursor:pointer; }
  .plate iframe { width:1920px; height:1080px; border:0; transform-origin:0 0;
    pointer-events:none; background:#000; }
  .plate .veil { position:absolute; inset:0; }

  .body { padding:14px 10px 4px; }
  .title { font-size:15px; font-weight:550; letter-spacing:-.01em; line-height:1.35; }
  .meta { font-family:var(--mono); font-size:11px; color:var(--ink-3); margin-top:6px;
    display:flex; align-items:center; gap:7px; }
  .tag { border:1px solid var(--line); border-radius:var(--r-pill); padding:1px 7px;
    font-size:10px; color:var(--ink-2); }

  .acts { display:flex; gap:6px; padding:10px 8px 6px; }
  .act.more { margin-left:auto; letter-spacing:.08em; }
  .act { font-family:var(--sans); font-size:12px; color:var(--ink-3); background:transparent;
    border:1px solid transparent; border-radius:var(--r-md); padding:5px 9px; cursor:pointer;
    transition:color .35s var(--ease), background .35s var(--ease); }
  .act:hover { color:var(--ink); background:#232327; }
  .act.primary { color:var(--ink); background:#232327; border-color:var(--line); }
  .act.primary:hover { background:#2C2C31; }
  .act.danger:hover { color:var(--danger); background:#2A1E20; }
  .act:focus-visible { outline:2px solid var(--focus); outline-offset:1px; }

  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
  @media (max-width:760px){ header,main{padding-left:18px;padding-right:18px} .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <img class="mark" src="/__dm/brand/icons/64x64.png" alt="">
  <span class="word">CUE</span>
  <span class="count" id="count">…</span>
  <span class="grow"></span>
  <button class="btn">New deck</button>
</header>
<main id="main"></main>

<script>
const fmt = ms => new Date(ms).toLocaleDateString(undefined,{day:'numeric',month:'short'});
const url = p => '/files/' + p.split('/').map(encodeURIComponent).join('/');

function card(d){
  const el = document.createElement('div'); el.className='card';
  const plate = document.createElement('div'); plate.className='plate';
  const f = document.createElement('iframe');
  f.src = url(d.path)+'?_snthumb=1#1'; f.loading='lazy'; f.tabIndex=-1;
  plate.append(f, Object.assign(document.createElement('div'),{className:'veil'}));
  new ResizeObserver(()=>{ f.style.transform='scale('+(plate.clientWidth/1920)+')'; }).observe(plate);

  const body = document.createElement('div'); body.className='body';
  const t = document.createElement('div'); t.className='title'; t.textContent=d.title;
  const m = document.createElement('div'); m.className='meta';
  m.innerHTML = (d.slides!=null? d.slides+' slides':'') + '<span>·</span>' + fmt(d.mtime);
  if (d.external){ const g=document.createElement('span'); g.className='tag'; g.textContent='external'; m.appendChild(g); }
  body.append(t,m);

  const acts = document.createElement('div'); acts.className='acts';
  const mk=(label,cls)=>{const b=document.createElement('button');b.className='act'+(cls?' '+cls:'');b.textContent=label;acts.appendChild(b);};
  mk('Open','primary'); mk('Slideshow'); mk('Present');
  const more=document.createElement('button'); more.className='act more'; more.textContent='···';
  more.title='PDF · Translate · Duplicate · Rename · Move · Hide'; acts.appendChild(more);
  el.append(plate,body,acts);
  return el;
}

(async () => {
  const decks = await (await fetch('/api/decks')).json();
  const vis = decks.filter(d=>!d.hidden);
  document.getElementById('count').textContent = vis.length + ' decks';
  const by = new Map();
  vis.forEach(d=>{ const g=d.group||''; if(!by.has(g)) by.set(g,[]); by.get(g).push(d); });
  const keys=[...by.keys()].sort((a,b)=> a===''?-1 : b===''?1 : a.localeCompare(b));
  const main=document.getElementById('main');
  for (const g of keys){
    const s=document.createElement('div'); s.className='sect';
    s.innerHTML='<h2>'+(g||'Ungrouped')+'</h2><span class="n">'+by.get(g).length+
      '</span><span class="rule"></span>';
    main.appendChild(s);
    const grid=document.createElement('div'); grid.className='grid';
    by.get(g).forEach(d=>grid.appendChild(card(d)));
    main.appendChild(grid);
  }
})();
</script>
</body>
</html>
