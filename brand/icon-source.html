<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:transparent;width:1024px;height:1024px;overflow:hidden}
</style></head>
<body>
<!-- CUE app icon. The mark: a bold "C" arc opening to the right, with the
     presenter's cue triangle sitting in the opening — "C" + play/cue in one
     shape. Dark plate matches the decks' own visual language. -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233c"/>
      <stop offset="1" stop-color="#070b16"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fc4ff"/>
    </linearGradient>
    <linearGradient id="cue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC24B"/>
      <stop offset="1" stop-color="#F2960F"/>
    </linearGradient>
  </defs>

  <!-- plate -->
  <rect x="96" y="96" width="832" height="832" rx="188" fill="url(#plate)"/>
  <rect x="96" y="96" width="832" height="832" rx="188" fill="none"
        stroke="#4F8EF7" stroke-opacity=".30" stroke-width="6"/>
  <!-- faint slide grid, echoing the deck backgrounds -->
  <g stroke="#4F8EF7" stroke-opacity=".07" stroke-width="3">
    <path d="M96 340h832M96 512h832M96 684h832"/>
    <path d="M340 96v832M684 96v832"/>
  </g>

  <!-- the C: thick arc, opening right -->
  <circle cx="512" cy="512" r="228" fill="none" stroke="url(#arc)" stroke-width="104"
          stroke-linecap="round"
          transform="rotate(38 512 512)"
          stroke-dasharray="1074 1432"/>

  <!-- cue triangle in the C's opening -->
  <path d="M566 424 L742 512 L566 600 Z" fill="url(#cue)" stroke="#070b16"
        stroke-width="10" stroke-linejoin="round"/>
</svg>
</body></html>
