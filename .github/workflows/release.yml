name: Build installers

# Produces downloads that need nothing pre-installed — the Node runtime is
# bundled inside each one:
#   CUE-macOS.dmg            drag-to-Applications disk image
#   CUE-Windows.zip          folder with node.exe + CUE.bat
#   CUE-linux-x64.tar.gz     portable tarball
#   cue_<version>_amd64.deb  Debian / Ubuntu package
#
# Runs on a version tag (v3.0.0) or manually from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 3.0.0)'
        required: true
        default: '0.0.0-dev'

env:
  NODE_VERSION: '22.14.0'      # runtime bundled into every artifact

jobs:
  # ------------------------------------------------------------------ macOS
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_REF_NAME: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

      - name: Build the app
        run: |
          cd native
          # Unsigned in CI unless a Developer ID is configured (see below).
          SIGN_IDENTITY="-" WORKSHOP_DIR="" ./build.sh

      - name: Bundle the Node runtime
        run: |
          ARCH=$([ "$(uname -m)" = "arm64" ] && echo arm64 || echo x64)
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-${ARCH}.tar.gz" | tar xz
          cp "node-v${NODE_VERSION}-darwin-${ARCH}/bin/node" native/CUE.app/Contents/Resources/node
          chmod +x native/CUE.app/Contents/Resources/node

      - name: Copy the tool into the bundle
        run: |
          R=native/CUE.app/Contents/Resources
          cp server.mjs start.mjs library.html cue.css edit-mode.js external-mode.js \
             presenter.js presenter.html annotate.js translate.html \
             unbundle.mjs cue-doctor.mjs AUTHORING.md "$R/"
          cp -R templates "$R/templates"

      - name: Re-sign (ad-hoc; a Developer ID is used when secrets are present)
        run: |
          codesign --force --deep --sign - native/CUE.app
          codesign --verify --strict native/CUE.app

      - name: Make the disk image
        run: |
          mkdir -p dmg && cp -R native/CUE.app dmg/ && ln -s /Applications dmg/Applications
          cp dist/README.txt dmg/"Read me first.txt"
          hdiutil create -volname "CUE" -srcfolder dmg -ov -format UDZO CUE-macOS.dmg

      - uses: actions/upload-artifact@v4
        with: { name: CUE-macOS, path: CUE-macOS.dmg }

  # ---------------------------------------------------------------- Windows
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble with a bundled runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path stage/CUE | Out-Null
          Copy-Item server.mjs,start.mjs,library.html,cue.css,edit-mode.js,external-mode.js,`
                    presenter.js,presenter.html,annotate.js,translate.html,`
                    unbundle.mjs,cue-doctor.mjs,AUTHORING.md,LICENSE stage/CUE
          Copy-Item -Recurse templates stage/CUE/templates
          Copy-Item -Recurse brand/icons stage/CUE/icons
          Copy-Item dist/README.txt stage/CUE/README.txt

          Invoke-WebRequest "https://nodejs.org/dist/v$env:NODE_VERSION/node-v$env:NODE_VERSION-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath nodetmp
          Copy-Item "nodetmp/node-v$env:NODE_VERSION-win-x64/node.exe" stage/CUE/node.exe

          # Launcher uses the bundled runtime — nothing to install.
          $bat = @(
            '@echo off',
            'cd /d "%~dp0"',
            'start "" /b "%~dp0node.exe" start.mjs %*'
          )
          Set-Content -Path stage/CUE/CUE.bat -Value $bat -Encoding ASCII

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path stage/CUE -DestinationPath CUE-Windows.zip

      - uses: actions/upload-artifact@v4
        with: { name: CUE-Windows, path: CUE-Windows.zip }

  # ------------------------------------------------------------------ Linux
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          V="${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}"
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"

      - name: Assemble with a bundled runtime
        run: |
          mkdir -p stage/opt/cue
          cp server.mjs start.mjs library.html cue.css edit-mode.js external-mode.js \
             presenter.js presenter.html annotate.js translate.html \
             unbundle.mjs cue-doctor.mjs \
             AUTHORING.md LICENSE dist/README.txt stage/opt/cue/
          cp -R templates stage/opt/cue/templates
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" | tar xJ
          cp "node-v${NODE_VERSION}-linux-x64/bin/node" stage/opt/cue/node
          chmod +x stage/opt/cue/node
          printf '#!/bin/sh\ncd /opt/cue\nexec /opt/cue/node /opt/cue/start.mjs "$@"\n' > stage/opt/cue/cue
          chmod +x stage/opt/cue/cue

      - name: Portable tarball
        run: tar czf CUE-linux-x64.tar.gz -C stage/opt cue

      - name: Debian package
        run: |
          V="${{ steps.v.outputs.version }}"
          mkdir -p pkg/DEBIAN pkg/opt pkg/usr/bin pkg/usr/share/applications
          cp -R stage/opt/cue pkg/opt/cue
          ln -s /opt/cue/cue pkg/usr/bin/cue
          for s in 16 24 32 48 64 128 256 512; do
            mkdir -p "pkg/usr/share/icons/hicolor/${s}x${s}/apps"
            cp "brand/icons/${s}x${s}.png" "pkg/usr/share/icons/hicolor/${s}x${s}/apps/cue.png"
          done
          cat > pkg/usr/share/applications/cue.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=CUE
          GenericName=HTML Presentation Studio
          Comment=Build, present and export HTML presentations
          Exec=/opt/cue/cue
          Icon=cue
          Terminal=false
          Categories=Office;Presentation;
          EOF
          cat > pkg/DEBIAN/control <<EOF
          Package: cue
          Version: ${V}
          Section: office
          Priority: optional
          Architecture: amd64
          Maintainer: Luis Assardo <luisassardo@gmail.com>
          Description: CUE — The HTML Presentation Studio
           Local studio for HTML presentations: library, inline editing,
           presenter view, shareable slideshow window and PDF export.
           The Node.js runtime is bundled; no other dependencies.
          EOF
          dpkg-deb --build --root-owner-group pkg "cue_${V}_amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: CUE-linux
          path: |
            CUE-linux-x64.tar.gz
            cue_*_amd64.deb

  # ----------------------------------------------------------------- release
  release:
    needs: [macos, windows, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
